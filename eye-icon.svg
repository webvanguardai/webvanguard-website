<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- iOS rounded square background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7eb8f7"/>
      <stop offset="100%" style="stop-color:#4a9eff"/>
    </linearGradient>
  </defs>

  <!-- Eye shape - outer -->
  <path d="M512 340 C340 340 200 512 200 512 C200 512 340 684 512 684 C684 684 824 512 824 512 C824 512 684 340 512 340 Z" 
        fill="none" stroke="url(#eyeGlow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Iris circle -->
  <circle cx="512" cy="512" r="110" fill="none" stroke="url(#eyeGlow)" stroke-width="36"/>
  
  <!-- Pupil -->
  <circle cx="512" cy="512" r="52" fill="url(#eyeGlow)"/>
  
  <!-- Subtle shine -->
  <circle cx="548" cy="476" r="22" fill="white" opacity="0.35"/>
</svg>
